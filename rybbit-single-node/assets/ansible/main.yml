---
# Converge a single-node Rybbit stack. Provider-independent: this needs an IPv4
# address reachable over SSH as root, and nothing else. See
# references/providers.md for the contract the OpenTofu layer must satisfy.
- name: Install single-node Rybbit analytics stack
  hosts: rybbit
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.wait_for_connection: {connect_timeout: 10, delay: 5, sleep: 5, timeout: 600}
    - ansible.builtin.setup:

  tasks:
    - name: Install Docker and backup tooling
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, rclone, ca-certificates, curl, openssl]
        state: present
        # No cache_valid_time. A fresh cloud image ships apt lists old enough to
        # name package versions the archive has already superseded, and the
        # install then fails on a 404 rather than fetching a current index --
        # which failed every create on its first task.
        update_cache: true

    # The machine otherwise keeps whatever hostname the image was built with.
    # Doing it here rather than in the provider resource keeps it portable, and
    # on Vultr avoids the resource attribute entirely -- changing that one is a
    # force-new that reinstalls the OS.
    - ansible.builtin.hostname: {name: "{{ deployment_name }}"}
    - ansible.builtin.systemd_service: {name: docker, enabled: true, state: started}

    - name: Create stack and data directories
      ansible.builtin.file: {path: "{{ item.path }}", state: directory, mode: "{{ item.mode }}"}
      loop:
        - {path: /opt/rybbit, mode: "0755"}
        - {path: "{{ postgres_data_dir }}", mode: "0700"}
        - {path: "{{ clickhouse_data_dir }}", mode: "0755"}
        - {path: "{{ redis_data_dir }}", mode: "0700"}
        - {path: "{{ rybbit_backup_dir }}", mode: "0700"}
        - {path: /var/lib/rybbit/caddy/data, mode: "0755"}
        - {path: /var/lib/rybbit/caddy/config, mode: "0755"}
        - {path: /var/lib/rybbit/clickhouse-users.d, mode: "0755"}

    # The setting name is version-dependent and a wrong one is IGNORED, not
    # rejected -- so the server starts, the profile looks installed, and the
    # schema still will not build. Verify with:
    #
    #   SELECT name, value FROM system.settings WHERE name LIKE '%json_type%'
    #
    # 24.8 (the verified pin) spells it allow_experimental_json_type. Current
    # upstream runs ClickHouse 26.x and spells it enable_json_type, with
    # allow_experimental_object_type gone entirely. See references/pins.md
    # before moving the ClickHouse version.
    - name: Enable the ClickHouse JSON types Rybbit's schema needs
      ansible.builtin.copy:
        dest: /var/lib/rybbit/clickhouse-users.d/allow-json.xml
        mode: "0644"
        content: |
          <clickhouse>
              <profiles>
                  <default>
                      {{ clickhouse_json_settings | trim | indent(22) }}
                  </default>
              </profiles>
          </clickhouse>
      notify: Restart Rybbit stack

    # Written once so the generated secrets survive a converge. That is correct
    # for the secrets and wrong for everything else in the file -- see the next
    # two tasks.
    - name: Generate retained database and auth secrets
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        pg_pwd=$(openssl rand -hex 24)
        ch_pwd=$(openssl rand -hex 24)
        redis_pwd=$(openssl rand -hex 24)
        auth_secret=$(openssl rand -hex 32)
        cat <<EOF > /opt/rybbit/stack.env
        POSTGRES_USER=rybbit
        POSTGRES_DB=rybbit
        POSTGRES_PASSWORD=$pg_pwd
        CLICKHOUSE_USER=default
        CLICKHOUSE_DB=rybbit
        CLICKHOUSE_PASSWORD=$ch_pwd
        REDIS_PASSWORD=$redis_pwd
        BETTER_AUTH_SECRET=$auth_secret
        DOMAIN_NAME={{ rybbit_host }}
        BASE_URL=https://{{ rybbit_host }}
        DISABLE_SIGNUP={{ rybbit_disable_signup | lower }}
        DISABLE_TELEMETRY=true
        EOF
      args: {executable: /bin/bash, creates: /opt/rybbit/stack.env}
      no_log: true

    - ansible.builtin.file: {path: /opt/rybbit/stack.env, mode: "0600", owner: root, group: root}

    # The write-once file above froze the signup policy at whatever the first
    # run wrote, so flipping it afterwards changed nothing, silently, on the
    # setting that decides whether strangers can register. Keep the policy lines
    # in step with desired state while leaving the generated secrets alone.
    - name: Keep the signup policy in step with desired state
      ansible.builtin.lineinfile:
        path: /opt/rybbit/stack.env
        regexp: "^DISABLE_SIGNUP="
        line: "DISABLE_SIGNUP={{ rybbit_disable_signup | lower }}"
      register: rybbit_signup_policy

    # An env_file is consulted when a container is created, not while it runs,
    # so a correct file and a restart are both insufficient.
    - name: Recreate the services that read the signup policy
      ansible.builtin.command: docker compose up -d --force-recreate backend client
      args: {chdir: /opt/rybbit}
      when: rybbit_signup_policy.changed

    - name: Install stack configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - {src: compose.yml, dest: /opt/rybbit/compose.yml}
        - {src: Caddyfile, dest: /opt/rybbit/Caddyfile}
        - {src: backup, dest: /usr/local/sbin/rybbit-backup, mode: "0700"}
      notify: Restart Rybbit stack

    # Root-only and outside both generated output and version control. The unit
    # reads these through EnvironmentFile, so they never appear in a unit file
    # or a process listing.
    - name: Install backup credentials
      ansible.builtin.copy:
        dest: /etc/rybbit-backup.env
        mode: "0600"
        content: |
          BACKUP_ACCESS_KEY_ID={{ lookup('env', 'RYBBIT_BACKUP_ACCESS_KEY_ID') }}
          BACKUP_SECRET_ACCESS_KEY={{ lookup('env', 'RYBBIT_BACKUP_SECRET_ACCESS_KEY') }}
      no_log: true

    - name: Install backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rybbit-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Rybbit database and analytics backups
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/etc/rybbit-backup.env
          ExecStart=/usr/local/sbin/rybbit-backup
      notify: Reload systemd

    - name: Install backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/rybbit-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Scheduled Rybbit backup
          [Timer]
          OnCalendar={{ backup_oncalendar }}
          Persistent=true
          RandomizedDelaySec=300
          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - ansible.builtin.meta: flush_handlers

    - name: Start the Rybbit stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args: {chdir: /opt/rybbit}
      register: compose_up
      changed_when: >-
        'Created' in (compose_up.stdout + compose_up.stderr) or
        'Recreated' in (compose_up.stdout + compose_up.stderr) or
        'Starting' in (compose_up.stdout + compose_up.stderr)

    - ansible.builtin.systemd_service: {name: rybbit-backup.timer, enabled: true, state: started}

    # Every single-file bind mount in this stack has the same trap: template and
    # copy replace a file by rename, so the running container keeps the inode it
    # started with, and `docker compose up -d` will not recreate a service whose
    # definition is unchanged. The host file looks correct while the container
    # serves the old bytes.
    #
    # Both entries below are single-FILE mounts, so both are affected -- the
    # ClickHouse profile just as much as the Caddyfile, and it is the quieter of
    # the two because a stale JSON-type setting surfaces as a schema that will
    # not build rather than as a missing header.
    #
    # Compare what each container is actually serving against the file on disk
    # and key the recreate on that difference, so a converge that finds a
    # container stale for any reason repairs it. A `changed` flag cannot see
    # this; only the container can.
    - name: Read the config checksums the containers are serving
      ansible.builtin.shell: |
        docker compose exec -T {{ item.service }} sha256sum {{ item.container_path }} 2>/dev/null | awk '{print $1}'
      args: {chdir: /opt/rybbit, executable: /bin/bash}
      register: running_config
      changed_when: false
      failed_when: false
      loop: &single_file_mounts
        - {service: caddy, container_path: /etc/caddy/Caddyfile, host_path: /opt/rybbit/Caddyfile}
        - {service: clickhouse, container_path: /etc/clickhouse-server/users.d/allow-json.xml,
           host_path: /var/lib/rybbit/clickhouse-users.d/allow-json.xml}

    - name: Read the config checksums on disk
      ansible.builtin.stat: {path: "{{ item.host_path }}", checksum_algorithm: sha256}
      register: desired_config
      loop: *single_file_mounts

    - name: Recreate any service serving a stale configuration
      ansible.builtin.command: docker compose up -d --force-recreate {{ item.0.item.service }}
      args: {chdir: /opt/rybbit}
      when: (item.0.stdout | default('') | trim) != item.1.stat.checksum
      loop: "{{ running_config.results | zip(desired_config.results) | list }}"
      loop_control:
        label: "{{ item.0.item.service }}"

    # From inside the container deliberately. When this passes and the public
    # HTTPS check does not, the fault is Caddy, DNS or TLS rather than the
    # application -- a distinction that is otherwise a guess.
    - name: Wait for the backend health endpoint inside the container
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, backend, wget, -qO-, "http://127.0.0.1:3001/api/health"]
      args: {chdir: /opt/rybbit}
      register: local_health
      changed_when: false
      retries: 60
      delay: 5
      until: local_health.rc == 0

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service: {daemon_reload: true}
    - name: Restart Rybbit stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args: {chdir: /opt/rybbit}
