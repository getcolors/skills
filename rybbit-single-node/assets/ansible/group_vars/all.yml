---
# Every knob the converge has. Non-secret values only: credentials come from the
# environment, are generated on the host, or live in a root-only file.

# --- Identity ---------------------------------------------------------------

# Name the deployment, not the region or the plan. It becomes the machine's
# hostname and the prefix backups are stored under, so it wants to be stable and
# to read as one deployment in a provider console.
deployment_name: rybbit

# The public hostname. TLS is issued for it and the client is built against it.
rybbit_host: rybbit.example.com

# --- Signup -----------------------------------------------------------------

# Rybbit has no first-run bootstrap: with signup disabled, nobody can create the
# first account, including you. Converge with this false, register immediately,
# then set it true and converge again. The window between is open to anyone who
# finds the hostname.
#
# Changing this later works only because the playbook reconciles the line and
# recreates the services -- env_file is read at container creation. Verify the
# change against the live /api/config, not against the file on disk.
rybbit_disable_signup: false

# Acceptance sends its synthetic pageview to a throwaway site with this domain,
# created on demand, so converges never write test rows into real analytics.
rybbit_acceptance_site_domain: colors-acceptance.invalid

# --- Images -----------------------------------------------------------------

# The application images publish :latest, which moves under the deployment. Pin
# both by digest and move them together -- they share a Postgres schema. See
# references/pins.md for how to resolve a digest and when to move.
rybbit_backend_image: ghcr.io/rybbit-io/rybbit-backend@sha256:f729f42575bf018ff97e9f36d49200665b99003a14868acbe56a9b32a9ed6ac7
rybbit_client_image: ghcr.io/rybbit-io/rybbit-client@sha256:f384c1f73a0c2fc0794526908a1fdb2ba410a5cdb3f105487af70f067c8f103a

postgres_image: postgres:17-alpine
clickhouse_image: clickhouse/clickhouse-server:24.8-alpine
redis_image: redis:8.6.4-alpine
caddy_image: caddy:2.11.4

# Rybbit's schema needs ClickHouse's JSON type, which is off by default. The
# setting name changed as the feature was promoted out of experimental, and a
# name the server does not recognise is IGNORED rather than rejected -- so the
# profile looks installed and the schema still will not build. Keep this in step
# with clickhouse_image, and confirm on the host with:
#
#   SELECT name, value FROM system.settings WHERE name LIKE '%json_type%'
#
# 24.8 (the verified pin):
clickhouse_json_settings: |
  <allow_experimental_json_type>1</allow_experimental_json_type>
  <allow_experimental_object_type>1</allow_experimental_object_type>
#
# 25.x and later, which is what current upstream ships -- allow_experimental_
# object_type no longer exists at all:
#
#   clickhouse_json_settings: |
#     <enable_json_type>1</enable_json_type>

# --- Persistent data --------------------------------------------------------

postgres_data_dir: /var/lib/rybbit/postgres
clickhouse_data_dir: /var/lib/rybbit/clickhouse
redis_data_dir: /var/lib/rybbit/redis
rybbit_backup_dir: /var/backups/rybbit

# --- Backups ----------------------------------------------------------------

# S3-compatible object storage. The example is Cloudflare R2; anything rclone
# can address with an s3 provider works, and the two credentials come from the
# environment (see main.yml).
backup_bucket: rybbit-backup
backup_endpoint: https://<account>.r2.cloudflarestorage.com
backup_oncalendar: "*-*-* 02:30:00"

# Applied to the bucket as well as the local disk. Pruning one copy is not a
# retention policy.
backup_retention_days: 7

# --- Proxy ------------------------------------------------------------------

# The ranges Caddy will trust to have set X-Forwarded-For. This MUST describe
# whatever actually sits in front of the origin. The default is Cloudflare's
# published set. If nothing proxies you, leave it -- it is inert, because the
# real client will not match. If something else proxies you, replace it, or
# every access log will record the edge instead of the visitor.
trusted_proxy_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
