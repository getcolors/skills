# Six services. Rendered by main.yml with ansible.builtin.template.
#
# Only caddy publishes ports. Postgres, ClickHouse, Redis and both application
# ports stay on the private network, so the provider firewall is a second layer
# rather than the only thing keeping the datastores off the internet.
services:
  caddy:
    image: {{ caddy_image }}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Caddy serves HTTP/3 over UDP and advertises it via alt-svc. Publish the
      # UDP port or browsers attempt QUIC, get nothing, and fall back to TCP --
      # which works, so this surfaces as intermittent slowness rather than an
      # error. The provider firewall needs the same hole.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/rybbit/caddy/data:/data
      - /var/lib/rybbit/caddy/config:/config
    depends_on:
      - backend
      - client
    # Access logs are on, so bound them: an ingestion endpoint writes a line per
    # request and the json-file driver never rotates on its own.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks:
      - internal

  postgres:
    image: {{ postgres_image }}
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - {{ postgres_data_dir }}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  clickhouse:
    image: {{ clickhouse_image }}
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - {{ clickhouse_data_dir }}:/var/lib/clickhouse
      # Rybbit's schema uses the experimental JSON and object types, which are
      # off by default. This is a users.d profile setting, not a config.d server
      # setting -- putting it in the wrong one is accepted and ignored.
      - /var/lib/rybbit/clickhouse-users.d/allow-json.xml:/etc/clickhouse-server/users.d/allow-json.xml:ro
    healthcheck:
      # 127.0.0.1 rather than localhost: name resolution inside the container is
      # not guaranteed to be what you assume, and a failed probe then looks like
      # a failed server.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: {{ redis_image }}
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - {{ redis_data_dir }}:/data
    # noeviction, not an LRU policy: this carries queue and session state, not
    # cache. An eviction policy silently discards work under pressure.
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  backend:
    image: {{ rybbit_backend_image }}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLUSTER_WORKERS=2
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  client:
    image: {{ rybbit_client_image }}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=https://{{ rybbit_host }}
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge
