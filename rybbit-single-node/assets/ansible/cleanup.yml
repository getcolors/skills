---
# Stop the stack before the provider layer tears the machine down, so the
# databases close cleanly rather than losing their host underneath them.
- name: Stop the Rybbit stack before infrastructure deletion
  hosts: rybbit
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.command: docker compose down
      args: {chdir: /opt/rybbit}
      register: compose_down
      changed_when: "'Removed' in (compose_down.stderr + compose_down.stdout)"
      # The machine may already be gone, or never have converged. Neither is a
      # reason to block the teardown that follows.
      failed_when: false
